services:
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    image: presentation-ai-service:local
    ports:
      - "8082:8082"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      PORT: "8082"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
